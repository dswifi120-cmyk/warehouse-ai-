<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Warehouse AI</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header class="topbar">
    <div>
      <h1>Warehouse AI</h1>
      <p>Invoice & Chalan Management</p>
    </div>

    <div class="user-box">
      <label>Entry By</label>

      <select id="userSelect">
        <option value="AKM JAKARIA">AKM JAKARIA</option>
        <option value="MD SOHAG">MD SOHAG</option>
        <option value="MD MOMIN">MD MOMIN</option>
      </select>
    </div>
  </header>


  <main class="container">

    <!-- UPLOAD SECTION -->
    <section class="upload-card">

      <h2>📷 Scan Invoice / Chalan</h2>

      <p class="help-text">
        একসাথে একাধিক Invoice বা Chalan-এর ছবি নির্বাচন করুন
      </p>

      <label class="upload-button">
        📁 Select Images
        <input
          type="file"
          id="invoiceInput"
          accept="image/*"
          multiple
          hidden
        >
      </label>

      <div id="selectedFiles" class="selected-files"></div>

      <button id="scanButton" class="primary-button">
        🤖 Scan With AI
      </button>

      <div id="scanStatus" class="status"></div>

    </section>


    <!-- FILTER -->
    <section class="filter-card">

      <div class="filter-item">
        <label>From Date</label>
        <input type="date" id="fromDate">
      </div>

      <div class="filter-item">
        <label>To Date</label>
        <input type="date" id="toDate">
      </div>

      <button id="filterButton" class="secondary-button">
        🔎 Search
      </button>

      <button id="todayButton" class="secondary-button">
        Today
      </button>

      <button id="printButton" class="print-button">
        🖨️ Print
      </button>

    </section>


    <!-- SUMMARY -->
    <section class="summary">

      <div class="summary-box">
        <span>Total Rows</span>
        <strong id="totalRows">0</strong>
      </div>

      <div class="summary-box">
        <span>Total Products</span>
        <strong id="totalProducts">0</strong>
      </div>

    </section>


    <!-- TABLE -->
    <section class="table-card">

      <div class="table-header">
        <h2>Daily OUT List</h2>

        <button id="addRowButton" class="add-button">
          + Add Product
        </button>
      </div>

      <div class="table-wrapper">

        <table id="productTable">

          <thead>
            <tr>
              <th>Date</th>
              <th>Product Name</th>
              <th>Quantity</th>
              <th>Unit</th>
              <th>Invoice / Chalan</th>
              <th>Entry By</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="productTableBody">
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- PRINT AREA -->
  <div id="printArea"></div>


  <script src="app.js"></script>

</body>
</html>
